<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic tac toe</title>
        <script src="/script.js" defer></script>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <!-- and here we go -->
        <div id="mode-selection-screen">
         
            <div id="start-header">
                <p>Choose mode</p>
            </div>

            <div id="mode-buttons">
                <button id="pvc-mode-btn">CPU</button>
                <button id="pvp-mode-btn">PVP</button>
            </div>
         
        </div>


        <div id="game-field" class="invisible">
            <div id="score-hud">
                <div id="player1-score" class="score">
                    <h1>player</h1>
                    <h3>0</h3>
                </div>
                <div id="player2-score" class="score">
                    <h1>player</h1>
                    <h3>0</h3>
                </div>
            </div>
            <div id="game-board">
                <div class="box" id="0,0"></div>
                <div class="box" id="0,1"></div>
                <div class="box" id="0,2"></div>
                <div class="box" id="1,0"></div>
                <div class="box" id="1,1"></div>
                <div class="box" id="1,2"></div>
                <div class="box" id="2,0"></div>
                <div class="box" id="2,1"></div>
                <div class="box" id="2,2"></div>
            </div>
        </div>

    </body>
</html>
